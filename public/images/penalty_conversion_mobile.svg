<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 420 840"
    width="420"
    height="840"
    role="img"
    aria-labelledby="penalty-conversion-mobile-title penalty-conversion-mobile-desc"
>
    <title id="penalty-conversion-mobile-title">
        無法轉換與可轉換的懲罰
    </title>
    <desc id="penalty-conversion-mobile-desc">
        上方懲罰在期限過後判定失敗，只能拿到勉強過；下方懲罰主文含有「否則懲罰
        +2」，失敗後會轉換成兩個新懲罰，之後由直播抽出。
    </desc>

    <defs>
        <marker
            id="penalty-conversion-mobile-arrow"
            viewBox="0 0 10 10"
            refX="8"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto"
        >
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8f98a8" />
        </marker>
    </defs>

    <rect width="420" height="840" rx="24" fill="#12151b" />
    <rect
        x="0.5"
        y="0.5"
        width="419"
        height="839"
        rx="23.5"
        fill="none"
        stroke="#ffffff14"
    />

    <!-- Without a conversion condition -->
    <rect
        x="155"
        y="20"
        width="110"
        height="28"
        rx="14"
        fill="#f871711f"
        stroke="#f8717159"
    />
    <text
        x="210"
        y="39"
        text-anchor="middle"
        font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"
        font-size="13"
        font-weight="700"
        fill="#f87171"
    >
        無法轉換
    </text>

    <rect
        x="20"
        y="60"
        width="380"
        height="84"
        rx="14"
        fill="#191c23"
        stroke="#ffffff14"
    />
    <text
        x="36"
        y="84"
        font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"
        font-size="11"
        letter-spacing="1.5"
        fill="#a6abb6"
    >
        懲罰主文
    </text>
    <text
        x="36"
        y="112"
        font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"
        font-size="17"
        font-weight="700"
        fill="#f4f5f7"
    >
        「2024 年結束以前
    </text>
    <text
        x="36"
        y="136"
        font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"
        font-size="17"
        font-weight="700"
        fill="#f4f5f7"
    >
        打完星鐵主線」
    </text>

    <line
        x1="210"
        y1="148"
        x2="210"
        y2="172"
        stroke="#8f98a8"
        stroke-width="2"
        marker-end="url(#penalty-conversion-mobile-arrow)"
    />

    <rect
        x="90"
        y="180"
        width="240"
        height="36"
        rx="18"
        fill="#f0b45e1a"
        stroke="#f0b45e59"
    />
    <text
        x="210"
        y="204"
        text-anchor="middle"
        font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"
        font-size="13"
        font-weight="700"
        fill="#f0b45e"
    >
        期限已過 → 判定失敗
    </text>

    <line
        x1="210"
        y1="220"
        x2="210"
        y2="244"
        stroke="#8f98a8"
        stroke-width="2"
        marker-end="url(#penalty-conversion-mobile-arrow)"
    />

    <rect
        x="20"
        y="250"
        width="380"
        height="138"
        rx="14"
        fill="#191c23"
        stroke="#ffffff14"
    />
    <text
        x="210"
        y="278"
        text-anchor="middle"
        font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"
        font-size="14"
        font-weight="700"
        fill="#f4f5f7"
    >
        原懲罰停留在失敗
    </text>
    <text
        x="210"
        y="312"
        text-anchor="middle"
        font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"
        font-size="22"
        font-weight="800"
        fill="#10b981"
    >
        ▲勉強過
    </text>
    <text
        x="210"
        y="342"
        text-anchor="middle"
        font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"
        font-size="12"
        fill="#a6abb6"
    >
        唯一能拿到的完成狀態
    </text>
    <text
        x="210"
        y="370"
        text-anchor="middle"
        font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"
        font-size="12"
        fill="#a6abb6"
    >
        永遠無法取得
        <tspan fill="#84cc16" text-decoration="line-through">▲已完成</tspan>
    </text>

    <!-- With a conversion condition -->
    <rect
        x="164"
        y="410"
        width="92"
        height="28"
        rx="14"
        fill="#5bc6a11f"
        stroke="#5bc6a159"
    />
    <text
        x="210"
        y="429"
        text-anchor="middle"
        font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"
        font-size="13"
        font-weight="700"
        fill="#5bc6a1"
    >
        可轉換
    </text>

    <rect
        x="20"
        y="450"
        width="380"
        height="84"
        rx="14"
        fill="#191c23"
        stroke="#ffffff14"
    />
    <text
        x="36"
        y="474"
        font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"
        font-size="11"
        letter-spacing="1.5"
        fill="#a6abb6"
    >
        懲罰主文
    </text>
    <text
        x="36"
        y="502"
        font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"
        font-size="17"
        font-weight="700"
        fill="#f4f5f7"
    >
        「2024 年結束以前打完
    </text>
    <text
        x="36"
        y="526"
        font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"
        font-size="17"
        font-weight="700"
        fill="#f4f5f7"
    >
        星鐵主線，<tspan fill="#5bc6a1">否則懲罰 +2</tspan>」
    </text>

    <line
        x1="210"
        y1="538"
        x2="210"
        y2="562"
        stroke="#8f98a8"
        stroke-width="2"
        marker-end="url(#penalty-conversion-mobile-arrow)"
    />

    <rect
        x="90"
        y="570"
        width="240"
        height="36"
        rx="18"
        fill="#f0b45e1a"
        stroke="#f0b45e59"
    />
    <text
        x="210"
        y="594"
        text-anchor="middle"
        font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"
        font-size="13"
        font-weight="700"
        fill="#f0b45e"
    >
        期限已過 → 判定失敗
    </text>

    <line
        x1="210"
        y1="610"
        x2="210"
        y2="634"
        stroke="#8f98a8"
        stroke-width="2"
        marker-end="url(#penalty-conversion-mobile-arrow)"
    />

    <rect
        x="20"
        y="640"
        width="380"
        height="138"
        rx="14"
        fill="#191c23"
        stroke="#ffffff14"
    />
    <text
        x="210"
        y="668"
        text-anchor="middle"
        font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"
        font-size="14"
        font-weight="700"
        fill="#5bc6a1"
    >
        轉換為 2 個新懲罰
    </text>
    <rect
        x="36"
        y="684"
        width="168"
        height="46"
        rx="10"
        fill="#0e1117"
        stroke="#ffffff1f"
    />
    <text
        x="120"
        y="706"
        text-anchor="middle"
        font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"
        font-size="12"
        font-weight="700"
        fill="#f4f5f7"
    >
        新懲罰 A
    </text>
    <text
        x="120"
        y="721"
        text-anchor="middle"
        font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"
        font-size="10"
        fill="#a6abb6"
    >
        未抽出
    </text>
    <rect
        x="216"
        y="684"
        width="168"
        height="46"
        rx="10"
        fill="#0e1117"
        stroke="#ffffff1f"
    />
    <text
        x="300"
        y="706"
        text-anchor="middle"
        font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"
        font-size="12"
        font-weight="700"
        fill="#f4f5f7"
    >
        新懲罰 B
    </text>
    <text
        x="300"
        y="721"
        text-anchor="middle"
        font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"
        font-size="10"
        fill="#a6abb6"
    >
        未抽出
    </text>
    <text
        x="210"
        y="756"
        text-anchor="middle"
        font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"
        font-size="12"
        fill="#a6abb6"
    >
        判定失敗後自動生成
    </text>
    <text
        x="210"
        y="774"
        text-anchor="middle"
        font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"
        font-size="13"
        font-weight="700"
        fill="#5bc6a1"
    >
        之後由直播抽出
    </text>

    <!-- Footer rule -->
    <line x1="20" y1="800" x2="400" y2="800" stroke="#ffffff14" />
    <text
        x="210"
        y="825"
        text-anchor="middle"
        font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"
        font-size="12"
        fill="#a6abb6"
    >
        主文出現「否則」、「失敗」等字，才算擁有轉換條件。
    </text>
</svg>
